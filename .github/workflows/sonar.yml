name: Sonar Continuos Integration

env:
  DOTNET_VERSION: '8.x'
  SONAR_ORG: 'sofxx7'
  SONAR_PROJECT: 'shorten-sofxx7'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sonarqube:
    name: Sonarqube Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Desactivar shallow clone es recomendado por SonarCloud

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurando la versión de NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Instalar Scanner
        run: dotnet tool install -g dotnet-sonarscanner

      - name: Agregar herramientas de .NET al PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Ejecutar Análisis
        working-directory: ./Shorten
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet restore
          dotnet-sonarscanner begin /k:"${{ env.SONAR_PROJECT }}" /o:"${{ env.SONAR_ORG }}" /d:sonar.host.url="https://sonarcloud.io"
          dotnet build --no-incremental
          dotnet-sonarscanner end
